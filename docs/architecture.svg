<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>To-do app on EC2: architecture</title>
  <desc>A visitor reaches Nginx on port 80 inside an EC2 instance in the default VPC. Nginx forwards to Gunicorn on localhost port 8000, which runs the Flask app backed by a SQLite file. systemd keeps Gunicorn running. The admin connects over SSH from one IP address, and code is pulled from GitHub.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4F6272"/>
    </marker>
  </defs>

  <rect width="900" height="460" fill="#FFFFFF"/>

  <!-- AWS cloud, VPC, security group -->
  <rect x="170" y="20" width="710" height="420" rx="10" fill="none" stroke="#232F3E" stroke-width="1.5"/>
  <text x="182" y="40" font-size="12" font-weight="600" fill="#232F3E">AWS Cloud, ap-south-1 (Mumbai)</text>

  <rect x="190" y="55" width="670" height="370" rx="8" fill="none" stroke="#1E7A4C" stroke-width="1.5"/>
  <text x="202" y="75" font-size="12" font-weight="600" fill="#1E7A4C">Default VPC, public subnet</text>

  <rect x="215" y="90" width="620" height="310" rx="8" fill="none" stroke="#C7511F" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="227" y="109" font-size="11" fill="#9A3F14">Security group todo-web-sg: HTTP 80 from anywhere, SSH 22 from my IP only</text>

  <!-- EC2 -->
  <rect x="240" y="130" width="570" height="250" rx="8" fill="#FAFBFC" stroke="#8A99A6" stroke-width="1.5"/>
  <text x="252" y="151" font-size="12" font-weight="600" fill="#16232E">EC2 t3.micro, Ubuntu 24.04 LTS</text>

  <g font-size="12" fill="#16232E" text-anchor="middle">
    <rect x="265" y="190" width="130" height="70" rx="6" fill="#E8F4F5" stroke="#0B6E7A" stroke-width="1.5"/>
    <text x="330" y="219" font-weight="600">Nginx</text>
    <text x="330" y="237" font-size="11">:80, reverse proxy</text>

    <rect x="430" y="190" width="150" height="70" rx="6" fill="#E8F4F5" stroke="#0B6E7A" stroke-width="1.5"/>
    <text x="505" y="219" font-weight="600">Gunicorn</text>
    <text x="505" y="237" font-size="11">127.0.0.1:8000, 2 workers</text>

    <rect x="620" y="190" width="170" height="70" rx="6" fill="#E8F4F5" stroke="#0B6E7A" stroke-width="1.5"/>
    <text x="705" y="219" font-weight="600">Flask app</text>
    <text x="705" y="237" font-size="11">to-do pages and /health</text>

    <rect x="620" y="295" width="170" height="60" rx="6" fill="#FFF3D6" stroke="#B26A00" stroke-width="1.5"/>
    <text x="705" y="321" font-weight="600">SQLite file</text>
    <text x="705" y="339" font-size="11">~/todo-data/todo.db</text>

    <rect x="430" y="295" width="150" height="60" rx="6" fill="#EEE8F7" stroke="#6B4FA0" stroke-width="1.5"/>
    <text x="505" y="321" font-weight="600">systemd</text>
    <text x="505" y="339" font-size="11">todo.service, auto-restart</text>
  </g>

  <!-- Outside actors -->
  <g font-size="12" fill="#16232E" text-anchor="middle">
    <rect x="10" y="190" width="130" height="70" rx="6" fill="#FFFFFF" stroke="#8A99A6" stroke-width="1.5"/>
    <text x="75" y="221" font-weight="600">Visitor</text>
    <text x="75" y="239" font-size="11">web browser</text>

    <rect x="10" y="290" width="130" height="60" rx="6" fill="#FFFFFF" stroke="#8A99A6" stroke-width="1.5"/>
    <text x="75" y="317" font-weight="600">Me (admin)</text>
    <text x="75" y="335" font-size="11">laptop</text>

    <rect x="10" y="85" width="130" height="60" rx="6" fill="#FFFFFF" stroke="#8A99A6" stroke-width="1.5"/>
    <text x="75" y="112" font-weight="600">GitHub</text>
    <text x="75" y="130" font-size="11">code repository</text>
  </g>

  <!-- Arrows -->
  <g stroke="#4F6272" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="142" y1="225" x2="263" y2="225"/>
    <line x1="397" y1="225" x2="428" y2="225"/>
    <line x1="582" y1="225" x2="618" y2="225"/>
    <line x1="705" y1="262" x2="705" y2="293"/>
    <line x1="142" y1="320" x2="238" y2="320" stroke-dasharray="5 4"/>
    <line x1="142" y1="120" x2="238" y2="150" stroke-dasharray="5 4"/>
  </g>
  <line x1="505" y1="293" x2="505" y2="262" stroke="#6B4FA0" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <g font-size="11" fill="#4F6272">
    <text x="152" y="217">HTTP :80</text>
    <text x="152" y="312">SSH :22</text>
    <text x="152" y="338">my IP only</text>
    <text x="152" y="103">git clone / pull</text>
    <text x="458" y="282">keeps running</text>
  </g>
</svg>
